<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Izumi Offline Player</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --black: #070b12;
    --navy: #0c1424;
    --panel: #111d32;
    --panel-light: #172642;
    --blue: #247bff;
    --blue-light: #65b5ff;
    --text: #edf5ff;
    --muted: #91a8c8;
    --border: #233b5d;
}

body {
    margin: 0;
    padding: 16px;
    background:
        radial-gradient(
            circle at top,
            #152c4e 0%,
            var(--black) 55%
        );
    background-color: var(--black);
    color: var(--text);
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 20px 0 25px;
}

h1 {
    color: var(--blue-light);
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #247bff55;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
}

.card {
    background: linear-gradient(
        145deg,
        var(--panel),
        #0c1321
    );
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 6px 20px #00000030;
}

h3 {
    color: var(--blue-light);
    font-size: 16px;
    margin-top: 0;
    margin-bottom: 12px;
}

video {
    width: 100%;
    max-height: 55vh;
    background: #000;
    border: 1px solid #263c5b;
    border-radius: 12px;
    display: block;
}

#videoTitle {
    color: var(--text);
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

#status {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

button,
input[type="text"] {
    width: 100%;
    border-radius: 10px;
    padding: 13px;
    margin-top: 9px;
    font-size: 14px;
    font-family: Arial, sans-serif;
}

button {
    border: 1px solid #398bff;
    background: linear-gradient(
        135deg,
        #247bff,
        #1552bd
    );
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s;
}

button:active {
    background: #103c88;
}

button:disabled {
    opacity: 0.6;
}

.secondary {
    background: var(--panel-light);
    border: 1px solid #304d75;
    color: #c6e0ff;
}

input[type="text"] {
    background: #080f1c;
    color: var(--text);
    border: 1px solid #2c466b;
    outline: none;
}

input[type="text"]:focus {
    border-color: var(--blue);
}

input[type="text"]::placeholder {
    color: #7185a3;
}

input[type="file"] {
    width: 100%;
    margin: 10px 0;
    color: var(--muted);
    font-size: 13px;
}

#playlist {
    padding: 0;
    margin: 10px 0 0;
    list-style: none;
}

#playlist li {
    background: #0b1424;
    border: 1px solid #233753;
    border-radius: 10px;
    margin-top: 8px;
    padding: 13px;
    font-size: 13px;
    color: #d7e7ff;
    overflow-wrap: anywhere;
    cursor: pointer;
}

#playlist li.active {
    background: #142b4b;
    border-color: var(--blue);
    color: var(--blue-light);
    box-shadow: inset 3px 0 0 var(--blue);
}

#updateStatus {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #0a1322;
    border: 1px solid #203958;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

#updateStatus a {
    display: block;
    margin-top: 10px;
    padding: 12px;
    border-radius: 9px;
    background: #173c70;
    border: 1px solid #327ce0;
    color: #d8eaff;
    text-align: center;
    text-decoration: none;
    overflow-wrap: anywhere;
}

#updateStatus a:active {
    background: #24599b;
}

#updateStatus p {
    color: #c4d6ed;
}

footer {
    text-align: center;
    color: #7185a3;
    font-size: 11px;
    line-height: 1.8;
    padding: 15px 5px;
}
      
          
</style>
</head>

<body>

<header>
    <h1>IZUMI PLAYER</h1>
    <div class="subtitle">
        MIDNIGHT BLUE EDITION
    </div>
</header>


<section class="card">

    <video id="player"
           controls
           playsinline
           preload="metadata">
    </video>

    <p id="videoTitle">Belum ada video dipilih</p>

    <div id="status">
        Pilih video dari penyimpanan HP kamu.
    </div>

</section>

<section class="card">

    <h3>📂 Tambahkan Video</h3>

    <input
        type="file"
        id="videoInput"
        accept="video/*"
        multiple>

    <button id="addButton">
        Tambahkan ke Daftar Putar
    </button>

    <button class="secondary" id="clearButton">
        Hapus Semua dari Daftar
    </button>

</section>

<section class="card">

    <h3>🎵 Daftar Putar</h3>

    <input
        type="text"
        id="search"
        placeholder="Cari nama video...">

    <ul id="playlist"></ul>

</section>

<section class="card">

    <h3>⚙️ Pengaturan</h3>

    <button class="secondary" id="volumeButton">
        Volume: 100%
    </button>

    <button class="secondary" id="updateButton">
        🔄 Periksa Pembaruan
    </button>

    <div id="updateStatus">
        Pemeriksaan update GitHub belum dihubungkan.
    </div>

</section>

<footer>
    Izumi Offline Player v1.0.0<br>
    Dibuat untuk pemutaran video lokal.
</footer>

<script>
(function () {
    var player = document.getElementById("player");
    var videoInput = document.getElementById("videoInput");
    var addButton = document.getElementById("addButton");
    var clearButton = document.getElementById("clearButton");
    var search = document.getElementById("search");
    var playlistElement = document.getElementById("playlist");
    var videoTitle = document.getElementById("videoTitle");
    var status = document.getElementById("status");
    var volumeButton = document.getElementById("volumeButton");

    var videos = [];
    var currentIndex = -1;
    var currentVolume = 1;

    function formatName(name) {
        return name || "Video tanpa nama";
    }

    function playVideo(index) {
        if (index < 0 || index >= videos.length) {
            return;
        }

        currentIndex = index;

        player.src = videos[index].url;
        videoTitle.textContent = videos[index].name;
        status.textContent =
            "Video " + (index + 1) +
            " dari " + videos.length;

        renderPlaylist();

        player.play().catch(function () {
            status.textContent =
                "Video siap. Tekan tombol Play untuk memulai.";
        });
    }

    function renderPlaylist() {
        var query = search.value.toLowerCase();

        playlistElement.innerHTML = "";

        for (var i = 0; i < videos.length; i++) {
            if (
                videos[i].name.toLowerCase().indexOf(query) === -1
            ) {
                continue;
            }

            var item = document.createElement("li");

            item.textContent =
                (i + 1) + ". " + videos[i].name;

            if (i === currentIndex) {
                item.className = "active";
            }

            item.setAttribute("data-index", i);

            item.addEventListener("click", function () {
                var index = parseInt(
                    this.getAttribute("data-index"),
                    10
                );

                playVideo(index);
            });

            playlistElement.appendChild(item);
        }

        if (videos.length === 0) {
            var empty = document.createElement("li");
            empty.textContent = "Daftar putar masih kosong.";
            empty.style.cursor = "default";
            playlistElement.appendChild(empty);
        }
    }

    addButton.addEventListener("click", function () {
        var files = videoInput.files;

        if (!files || files.length === 0) {
            status.textContent =
                "Pilih satu atau beberapa video terlebih dahulu.";
            return;
        }

        var added = 0;

        for (var i = 0; i < files.length; i++) {
            var file = files[i];

            if (
                file.type.indexOf("video/") !== 0 &&
                !/\.(mp4|mkv|webm|mov|3gp|avi|m4v)$/i.test(file.name)
            ) {
                continue;
            }

            videos.push({
                name: formatName(file.name),
                url: URL.createObjectURL(file)
            });

            added++;
        }

        renderPlaylist();

        status.textContent =
            added + " video ditambahkan.";

        videoInput.value = "";

        if (currentIndex === -1 && videos.length > 0) {
            playVideo(0);
        }
    });

    clearButton.addEventListener("click", function () {
        player.pause();
        player.removeAttribute("src");
        player.load();

        for (var i = 0; i < videos.length; i++) {
            URL.revokeObjectURL(videos[i].url);
        }

        videos = [];
        currentIndex = -1;

        videoTitle.textContent = "Belum ada video dipilih";
        status.textContent = "Daftar putar telah dikosongkan.";

        renderPlaylist();
    });

    search.addEventListener("input", renderPlaylist);

    player.addEventListener("ended", function () {
        if (currentIndex + 1 < videos.length) {
            playVideo(currentIndex + 1);
        }
    });

    volumeButton.addEventListener("click", function () {
        if (currentVolume === 1) {
            currentVolume = 0.5;
        } else if (currentVolume === 0.5) {
            currentVolume = 0;
        } else {
            currentVolume = 1;
        }

        player.volume = currentVolume;

        volumeButton.textContent =
            "Volume: " +
            Math.round(currentVolume * 100) + "%";
     });
      
    var updateButton = document.getElementById("updateButton");
    var updateStatus = document.getElementById("updateStatus");

    // Versi aplikasi yang sedang terpasang
    var CURRENT_VERSION = "1.0.0";

    // Alamat GitHub Releases API
    var RELEASES_API =
        "https://api.github.com/repos/AriIzuP/Izumi-offline-player-media/releases/latest";

    var RELEASES_PAGE =
        "https://github.com/AriIzuP/Izumi-offline-player-media/releases";

    // Membandingkan nomor versi
    function compareVersions(a, b) {
        a = String(a).replace(/^v/i, "").split(".");
        b = String(b).replace(/^v/i, "").split(".");

        for (var i = 0; i < Math.max(a.length, b.length); i++) {
            var av = parseInt(a[i] || "0", 10) || 0;
            var bv = parseInt(b[i] || "0", 10) || 0;

            if (av > bv) return 1;
            if (av < bv) return -1;
        }

        return 0;
    }

    // Membuat tautan yang bisa ditekan
    function showReleaseLink(url, label) {
        var link = document.createElement("a");

        link.href = url;
        link.textContent = label;
        link.style.display = "block";
        link.style.marginTop = "10px";
        link.style.padding = "10px";
        link.style.borderRadius = "8px";
        link.style.background = "#352746";
        link.style.color = "#dfc9ff";
        link.style.textAlign = "center";
        link.style.overflowWrap = "anywhere";
        link.style.textDecoration = "none";

        updateStatus.appendChild(link);
    }

    // Ketika tombol update ditekan
    updateButton.addEventListener("click", function () {
        updateButton.disabled = true;
        updateStatus.textContent = "Memeriksa rilis GitHub...";

        var request = new XMLHttpRequest();

        request.open("GET", RELEASES_API, true);
        request.timeout = 15000;

        request.setRequestHeader(
            "Accept",
            "application/vnd.github+json"
        );

        request.onload = function () {
            updateButton.disabled = false;

            // Belum ada Release
            if (request.status === 404) {
                updateStatus.textContent =
                    "Belum ada Release yang dipublikasikan. " +
                    "Versi aplikasi: " + CURRENT_VERSION + ".";

                showReleaseLink(
                    RELEASES_PAGE,
                    "Buka halaman Release GitHub"
                );

                return;
            }

            // Jika terjadi kesalahan dari server
            if (request.status < 200 || request.status >= 300) {
                updateStatus.textContent =
                    "GitHub merespons dengan kode " +
                    request.status + ". Coba lagi nanti.";

                return;
            }

            try {
                var release = JSON.parse(request.responseText);

                var latest = release.tag_name || release.name || "";
                var releaseUrl = release.html_url || RELEASES_PAGE;

                if (!latest) {
                    updateStatus.textContent =
                        "Versi rilis tidak ditemukan.";

                    showReleaseLink(
                        RELEASES_PAGE,
                        "Buka halaman Release GitHub"
                    );

                    return;
                }

                var result = compareVersions(
                    latest,
                    CURRENT_VERSION
                );

                // Ada versi lebih baru
                if (result > 0) {
                    updateStatus.textContent =
                        "Versi baru tersedia: " + latest +
                        ". Versi terpasang: " + CURRENT_VERSION +
                        ". Pembaruan belum dipasang otomatis.";

                    if (release.body) {
                        var notes = document.createElement("p");

                        notes.textContent =
                            release.body.substring(0, 400);

                        updateStatus.appendChild(notes);
                    }

                    showReleaseLink(
                        releaseUrl,
                        "Lihat dan unduh versi terbaru"
                    );

                } else {
                    // Versi terpasang sudah terbaru
                    updateStatus.textContent =
                        "Kamu menggunakan versi " +
                        CURRENT_VERSION +
                        ". Versi rilis terbaru di GitHub: " +
                        latest + ".";

                    showReleaseLink(
                        releaseUrl,
                        "Lihat catatan rilis"
                    );
                }

            } catch (e) {
                updateStatus.textContent =
                    "Data rilis GitHub tidak bisa dibaca.";
            }
        };

        request.onerror = function () {
            updateButton.disabled = false;

            updateStatus.textContent =
                "Tidak bisa terhubung ke GitHub. " +
                "Periksa koneksi internet.";
        };

        request.ontimeout = function () {
            updateButton.disabled = false;

            updateStatus.textContent =
                "Pemeriksaan terlalu lama. Coba lagi nanti.";
        };

        request.send();
    });

    renderPlaylist();
})();
</script>

</body>
</html>
